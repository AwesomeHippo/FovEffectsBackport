buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "http://files.minecraftforge.net/maven"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
    }
    dependencies {
        classpath ('com.anatawa12.forge:ForgeGradle:1.2-1.0.+') {

            changing = true

        }
    }
}

apply plugin: 'forge'
apply plugin: 'java'
compileJava {
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
}

sourceCompatibility = '1.8'
targetCompatibility = '1.8'

version = "1.0.0"
group = "com.awesomehippo.foveffectsbackport"
archivesBaseName = "fov-effects-backport-1.7.10"

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "eclipse"
}

repositories {
    maven {
        name = "GTNH"
        url = "https://nexus.gtnewhorizons.com/repository/public/"
    }
}

dependencies {
    compileOnly("com.github.GTNewHorizons:Angelica:2.1.42:dev") {
        transitive = false
    }
}

jar {
    manifest {
        attributes 'FMLAT': 'fml_at.cfg'
    }

    from('LICENSE') {
        into 'META-INF'
    }
}